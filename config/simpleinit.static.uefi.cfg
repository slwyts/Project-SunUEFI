# SunUEFI 内置 SimpleInit 配置；随固件发布，不需要复制到磁盘。
# 用户配置在本文件之后加载，只需保存自己修改的设置。

language = "zh_CN.UTF-8"
gui.dpi = 600
gui.rotate = 0
gui.driver.pointer.use_first = false

# 默认选中 Linux，五秒内没有操作就启动。
boot.default = "linux"
boot.second = "simple-init"
boot.timeout = 5
boot.uefi_probe = true
boot.uefi_bootmenu = true

# order 决定显示顺序；Windows 和其他系统由扫描器动态加入。
boot.configs.linux {
    mode = "exit"
    desc = "启动 Linux"
    icon = "@bootitem-linux"
    show = true
    enabled = true
    order = 10
}

boot.configs.boot-file {
    mode = "simple-init"
    desc = "从文件启动"
    show = true
    enabled = true
    order = 40
    extra.activity = "boot-file"
}

boot.configs.setup {
    mode = "exit"
    desc = "固件设置"
    show = true
    enabled = true
    order = 50
}

boot.configs.shell {
    mode = "exit"
    desc = "UEFI Shell"
    show = true
    enabled = true
    order = 60
}

boot.configs.files {
    mode = "simple-init"
    desc = "文件管理器"
    show = true
    enabled = true
    order = 70
    extra.activity = "file-manager"
}

boot.configs.simple-init {
    mode = "simple-init"
    desc = "工具"
    show = true
    enabled = true
    order = 80
}

boot.configs.uefi-bootmenu {
    mode = "folder"
    desc = "UEFI 启动项"
    show = false
    enabled = true
    order = 90
}

boot.configs.continue {
    mode = "exit"
    desc = "重启"
    show = true
    enabled = true
    order = 100
}

boot.configs.reboots {
    mode = "folder"
    desc = "电源与重启"
    show = true
    enabled = true
    order = 95
}

boot.configs.poweroff {
    mode = "poweroff"
    desc = "关机"
    parent = "reboots"
    show = true
    enabled = true
    order = 10
}
boot.configs.reboot {
    mode = "reboot"
    desc = "普通重启"
    parent = "reboots"
    show = true
    enabled = true
    order = 20
}
boot.configs.recovery {
    mode = "reboot"
    desc = "重启到 Recovery"
    parent = "reboots"
    show = true
    enabled = true
    order = 30
    extra.arg = "recovery"
}
boot.configs.bootloader {
    mode = "reboot"
    desc = "重启到 Bootloader"
    parent = "reboots"
    show = true
    enabled = true
    order = 40
    extra.arg = "bootloader"
}
boot.configs.edl {
    mode = "reboot"
    desc = "重启到 EDL（9008）"
    parent = "reboots"
    show = true
    enabled = true
    order = 50
    extra.arg = "edl"
}
