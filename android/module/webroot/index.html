<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>SunUEFI</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">PROJECT SUNUEFI · PIANO</p>
      <h1>选择下一次启动</h1>
      <p class="intro">默认进入 Android。确认的持久选择会继续生效，直到重新改选；原厂恢复入口仍需独立验证。</p>
    </header>
    <section class="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <div><strong id="status-title">源码预览，启动请求尚未就绪</strong><p id="status-detail">正在读取本地模块信息。</p></div>
    </section>
    <section class="choices" aria-label="启动目标">
      <article>
        <span class="number">01</span><h2>UEFI</h2>
        <p>进入 SunUEFI 菜单，选择系统或打开设置。</p>
        <button id="request-uefi" data-target="uefi" disabled>请求启动 UEFI</button>
      </article>
      <article>
        <span class="number">02</span><h2>Linux</h2>
        <p>通过同一 UEFI 核心进入已安装的 Linux。</p>
        <button id="request-linux" data-target="linux" disabled>请求启动 Linux</button>
      </article>
    </section>
    <section class="preview">
      <label for="preview-target">只读预览</label>
      <select id="preview-target"><option value="uefi">UEFI 请求</option><option value="linux">Linux 请求</option><option value="setup">UEFI 设置请求</option></select>
      <p id="preview-detail">预览不会写入请求，也不会重启。</p>
    </section>
    <footer>本页尚未连接管理器 bridge。原生持久请求接口已实现，在线读写与 Recovery 仍待实机验证；本页不会自行写入或重启。</footer>
  </main>
</body>
</html>
