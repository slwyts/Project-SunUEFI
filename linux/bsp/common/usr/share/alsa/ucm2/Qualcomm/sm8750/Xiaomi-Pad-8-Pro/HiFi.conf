# Xiaomi Pad 8 Pro (piano): four FourSemi FS19xx amplifiers on the
# secondary LPAIF TDM port, digital microphones on the VA macro.
#
# The sound card maps a stereo stream to the top pair of speakers (seen in
# landscape with the front camera at the top) and a four-channel stream
# (FL, FR, LS, RS) to all four.

SectionVerb {
	# The front end to back end routes belong to the verb: the PCMs do not
	# open without them, and PipeWire opens every PCM while it probes the
	# verb, before any device is enabled.
	EnableSequence [
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		# Open all four hardware slots; PipeWire duplicates ordinary stereo.
		PlaybackChannels 4
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC1"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_DEC0 Volume' 84"
	]
	DisableSequence [
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA_DEC0 Volume' 0"
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}
