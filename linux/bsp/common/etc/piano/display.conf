# Read by /usr/lib/piano/display-start (piano-display.service).
# separate_gpu_kms=1 keeps the GPU a DRM device of its own, so a GPU
# failure cannot hold back the display (and the other way round).
MSM_OPTIONS=separate_gpu_kms=1
# Highest stage run by the service: 3 = GPU only (simpledrm stays),
# 5 = native display as well.
LAST_STAGE=5
