# Hardware drivers bind through normal OF/platform/RPMsg aliases.
options hci_uart piano_retries=0 piano_peri=106
options msm separate_gpu_kms=1
# MCA is the sole GLINK power-endpoint driver; do not bind generic BATTMGR.
blacklist qcom_battmgr
options piano_mca charge_policy=1 hv_charge=1 charge_current=1 pan_ack=0 mipps_auth=1 cp_charge=1
# Virtual camera devices have no hardware alias. Only they need explicit load.
options v4l2loopback devices=2 video_nr=40,41 card_label="Rear Camera,Front Camera" exclusive_caps=1,1
