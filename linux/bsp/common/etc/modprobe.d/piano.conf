# Only piano-radio / piano-touch may start the ordered DMA masters.
blacklist pinctrl_sm8750
blacklist gpi
blacklist spi_geni_qcom
blacklist nt36532e_ts
blacklist gpio_shared_proxy
blacklist pwrseq_qcom_wcn
blacklist pci_pwrctrl_pwrseq
blacklist phy_qcom_qmp_pcie
install phy_qcom_qmp_pcie /bin/false
blacklist qrtr_mhi
blacklist ath12k_wifi7
blacklist hci_uart
blacklist qcom_q6v5_pas
blacklist piano_mca
blacklist sc8541_charger
options phy_qcom_qmp_pcie piano_skip_bcr=1
options hci_uart piano_retries=0 piano_peri=106
# Unvalidated drivers for stock-DT nodes; never autoload (see 80-drivers.rules).
blacklist coresight
blacklist coresight_funnel
blacklist coresight_replicator
blacklist fastrpc
blacklist apr
blacklist snd_soc_fs19xx
blacklist pmic_glink
blacklist qcom_battmgr
blacklist ucsi_glink
blacklist pmic_glink_altmode
blacklist slim_qcom_ngd_ctrl
blacklist leds_qcom_lpg
blacklist qcom_spmi_temp_alarm
# Native display / GPU: only piano-display (display-start) loads these.
blacklist arm_smmu
blacklist gpucc_sm8750
blacklist dispcc_sm8750
blacklist msm
blacklist panel_novatek_nt36532
blacklist ktz8866
blacklist i2c_qcom_geni
# Video codec: only piano-video (video-start) loads these.
blacklist videocc_sm8750
blacklist qcom_iris
# Keyboard cover: only piano-keyboard (keyboard-start) loads this.
blacklist hid_nanosic_wn8030
# Cameras: only piano-camera (camera-start) loads these. cma_heap never:
# libcamera would allocate from the small default CMA area first.
blacklist cambistmclkcc_sm8750
blacklist camcc_sm8750
blacklist i2c_qcom_cci
blacklist s5kjn1
blacklist ov32d40
blacklist dw9768
blacklist qcom_camss
blacklist cma_heap
# Application-facing cameras: piano-camerad feeds the hardware ISP output
# into these; exclusive_caps makes them plain capture devices for readers.
options v4l2loopback devices=2 video_nr=40,41 card_label="Rear Camera,Front Camera" exclusive_caps=1,1
