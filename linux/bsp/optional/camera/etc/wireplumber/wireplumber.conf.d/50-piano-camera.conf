# Applications get the cameras from the v4l2loopback devices that
# piano-camerad feeds with the hardware ISP output. The CAMSS capture nodes
# belong to the daemon, and libcamera must not claim the sensors.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
monitor.v4l2.rules = [
  {
    matches = [ { device.product.name = "Qualcomm Camera Subsystem" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
