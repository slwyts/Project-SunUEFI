# SPDX-License-Identifier: MIT
#
# tuned-ppd reads this file to translate GNOME's three power modes into TuneD
# profiles. It is presented as /etc/tuned/ppd.conf inside the service by
# tuned-ppd.service.d/50-piano-ppd.conf, so the packaged conffile stays intact
# and package upgrades never ask about local changes.
#
# There is no balanced-battery profile: the battery mapping points at the same
# ceiling, because the difference this device needs is the CPU/GPU limit rather
# than a separate on-battery policy.
[main]
default=balanced
battery_detection=true

[profiles]
power-saver=piano-power-saver
balanced=piano-balanced
performance=piano-performance

[battery]
balanced=piano-balanced
