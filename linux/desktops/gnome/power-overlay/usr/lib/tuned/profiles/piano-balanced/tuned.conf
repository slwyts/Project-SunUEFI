# SPDX-License-Identifier: MIT
#
# Balanced ceiling, the default profile. The values come from the piano board
# profiles published with the upstream xiaomipad-8pro-mainline integration
# (device/power/tuned, MIT), which were checked on this SoC.
#
# Only the GPU ceiling is written, never its floor; see the power-saver profile
# for why the floor is left alone.
[main]
summary=Piano balanced CPU and GPU policy

[sysfs]
/sys/devices/system/cpu/cpufreq/boost=0
/sys/devices/system/cpu/cpufreq/policy0/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy6/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=384000
/sys/devices/system/cpu/cpufreq/policy6/scaling_min_freq=1017600
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=3532800
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=4089600
/sys/class/devfreq/3d00000.gpu/max_freq=1100000000
