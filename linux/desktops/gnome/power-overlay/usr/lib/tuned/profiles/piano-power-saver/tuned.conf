# SPDX-License-Identifier: MIT
#
# Power saver ceiling. The values come from the piano board profiles published
# with the upstream xiaomipad-8pro-mainline integration (device/power/tuned,
# MIT), which were checked on this SoC.
#
# Only the GPU ceiling is written, never its floor: the driver raises the floor
# to the ceiling when a lower ceiling is applied after a floor write, which pins
# the GPU at 342 MHz instead of letting it idle at 160 MHz. With the ceiling
# written alone the floor stays at its 160 MHz default.
[main]
summary=Piano power saver CPU and GPU policy

[sysfs]
/sys/devices/system/cpu/cpufreq/boost=0
/sys/devices/system/cpu/cpufreq/policy0/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy6/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=384000
/sys/devices/system/cpu/cpufreq/policy6/scaling_min_freq=1017600
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=1785600
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=1958400
/sys/class/devfreq/3d00000.gpu/max_freq=342000000
