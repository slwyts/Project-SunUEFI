# SPDX-License-Identifier: MIT
#
# Performance ceiling: CPU boost on, policy6 at 4320000 kHz. That frequency is
# accepted by the SoC although scaling_available_frequencies stops at 4089600,
# so the value is written directly rather than filtered against that list.
#
# The values come from the piano board profiles published with the upstream
# xiaomipad-8pro-mainline integration (device/power/tuned, MIT).
[main]
summary=Piano performance CPU and GPU policy

[sysfs]
/sys/devices/system/cpu/cpufreq/boost=1
/sys/devices/system/cpu/cpufreq/policy0/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy6/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=384000
/sys/devices/system/cpu/cpufreq/policy6/scaling_min_freq=1017600
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=3532800
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=4320000
/sys/class/devfreq/3d00000.gpu/max_freq=1100000000
