[Service]
# tuned-ppd ships /etc/tuned/ppd.conf as a dpkg conffile. Replacing it in the
# image would make every upgrade of the package ask whether to keep or replace
# local changes, and a "keep" would silently drop the mapping. Present our file
# as that path inside the service instead; the packaged conffile stays as
# shipped and removing this drop-in restores the stock mapping after a restart.
BindReadOnlyPaths=/etc/tuned/piano-ppd.conf:/etc/tuned/ppd.conf
