name: Transfer a build input
description: Pass build files to another job in the same workflow run
inputs:
  operation:
    description: upload or download
    required: true
  name:
    description: Short name of the build input
    required: true
  paths:
    description: Literal workspace-relative paths, one per line, for upload
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        BUILD_INPUT_OPERATION: ${{ inputs.operation }}
        BUILD_INPUT_NAME: ${{ inputs.name }}
        BUILD_INPUT_PATHS: ${{ inputs.paths }}
      run: |
        case "$BUILD_INPUT_OPERATION" in
          upload)
            if [[ -z "$BUILD_INPUT_PATHS" ]]; then
              echo 'Uploading a build input requires paths.' >&2
              exit 1
            fi
            ;;
          download)
            if [[ -n "$BUILD_INPUT_PATHS" ]]; then
              echo 'Only uploads accept paths.' >&2
              exit 1
            fi
            ;;
          *)
            echo 'Build input operation must be upload or download.' >&2
            exit 1
            ;;
        esac
        if [[ ! "$BUILD_INPUT_NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
          echo 'Build input name must use lowercase letters, numbers and hyphens.' >&2
          exit 1
        fi
        directory=$(mktemp -d "$RUNNER_TEMP/sunuefi-build-input-$BUILD_INPUT_NAME.XXXXXX")
        printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
    - if: inputs.operation == 'upload'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ARCHIVE: ${{ steps.prepare.outputs.directory }}/input.tar.zst
        BUILD_INPUT_PATHS: ${{ inputs.paths }}
      run: bash "$GITHUB_ACTION_PATH/archive.sh" upload "$ARCHIVE" "$BUILD_INPUT_PATHS"
    - if: inputs.operation == 'upload'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: build-input-${{ inputs.name }}
        path: ${{ steps.prepare.outputs.directory }}/input.tar.zst
        if-no-files-found: error
        compression-level: 0
        overwrite: true
        retention-days: 7
    - if: inputs.operation == 'download'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: build-input-${{ inputs.name }}
        path: ${{ steps.prepare.outputs.directory }}
        digest-mismatch: error
    - if: inputs.operation == 'download'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ARCHIVE: ${{ steps.prepare.outputs.directory }}/input.tar.zst
      run: bash "$GITHUB_ACTION_PATH/archive.sh" download "$ARCHIVE"
    - if: always() && steps.prepare.outputs.directory != ''
      shell: bash
      env:
        DIRECTORY: ${{ steps.prepare.outputs.directory }}
      run: |
        if [[ -f "$DIRECTORY/input.tar.zst" ]]; then
          unlink -- "$DIRECTORY/input.tar.zst"
        fi
        rmdir -- "$DIRECTORY"
