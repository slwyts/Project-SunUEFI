name: Restore verified shared build output
description: Restore the same manifest and files saved by the common build
inputs:
  kind:
    description: firmware or kernel
    required: true
  key:
    description: Exact cache key from the shared-product inputs
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          artifacts/product
          artifacts/android
          artifacts/simpleinit/product
          artifacts/kernels/release
          artifacts/packages/kernel
          build/shared-products/${{ inputs.kind }}.json
          build/kernels/release/.config
          build/kernels/release/Makefile
          build/kernels/release/Module.symvers
          build/kernels/release/include
          build/kernels/release/scripts
          build/kernels/release/arch/arm64/include/generated
          build/kernel-sources
        key: ${{ inputs.key }}
        fail-on-cache-miss: true
