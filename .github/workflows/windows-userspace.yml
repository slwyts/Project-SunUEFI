name: Windows Adreno user-mode driver

on:
  push:
    branches: [woa]
    paths: &inputs
      - 'upstream/woa_oneplus_ace5_pro'
      - 'config/windows-graphics.json'
      - 'tools/build/windows_umd.py'
      - 'tools/build/windows_turnip.py'
      - 'tools/build/windows.py'
      - 'sources.lock.json'
      - 'windows/drivers/packages.config'
      - 'windows/drivers/adreno/requirements-build.txt'
      - 'build.sh'
      - '.github/workflows/windows-userspace.yml'
  pull_request:
    branches: [woa, main]
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-userspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select the pinned Adreno source
        id: donor
        shell: pwsh
        run: |
          $source = (Get-Content sources.lock.json -Raw | ConvertFrom-Json).woa_oneplus_ace5_pro
          "repo=$(([Uri]$source.url).AbsolutePath.Trim('/').Replace('.git',''))" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD:upstream/woa_oneplus_ace5_pro)" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.donor.outputs.repo }}
          ref: ${{ steps.donor.outputs.commit }}
          path: upstream/woa_oneplus_ace5_pro
          sparse-checkout: |
            src/qcom-gpu
            src/mesa
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/source-cache/windows-graphics
            build/windows/nuget/Microsoft.Windows.WDK.arm64.*/c/Include/*/um
            build/windows/nuget/Microsoft.Windows.WDK.arm64.*/c/Include/*/shared
          key: arm64-umd-inputs-${{ hashFiles('config/windows-graphics.json', 'windows/drivers/packages.config') }}
      - name: Restore graphics libraries built with the same sources and toolchain
        id: libraries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/windows/drivers/adreno/Release
          key: win-arm64-graphics-${{ steps.donor.outputs.image }}-${{ steps.donor.outputs.commit }}-${{ hashFiles('build.sh', 'tools/build/windows*.py', 'windows/drivers/packages.config', 'windows/drivers/adreno/requirements-build.txt', 'config/windows-graphics.json', '.github/workflows/windows-userspace.yml') }}
      - name: Build the native ARM64 Direct3D and Vulkan drivers
        if: steps.libraries.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (!(Get-Command win_bison,bison -ErrorAction SilentlyContinue) -or
              !(Get-Command win_flex,flex -ErrorAction SilentlyContinue)) {
            choco install winflexbison3 --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $includes = 'build/windows/nuget/Microsoft.Windows.WDK.arm64.*/c/Include/*'
          if (!(Test-Path "$includes/um/d3d10umddi.h")) {
            nuget restore windows/drivers/packages.config -PackagesDirectory build/windows/nuget -NonInteractive
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $wdk = Get-ChildItem $includes -Directory | Where-Object { Test-Path "$($_.FullName)/um/d3d10umddi.h" } | Select-Object -First 1
          $installer = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $installer -latest -products '*' -property installationPath
          $vc = Get-ChildItem "$vs/VC/Tools/MSVC" -Directory | Where-Object { Test-Path "$($_.FullName)/lib/arm64/msvcprt.lib" } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $sdkRoot = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $sdk = Get-ChildItem "$sdkRoot/Include" -Directory | Where-Object { Test-Path "$($_.FullName)/um/windows.h" } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$wdk -or !$vc -or !$sdk) { throw 'Missing ARM64 VC libraries or SDK/WDK user-mode headers.' }
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=arm64'
          python -m pip install --disable-pip-version-check -r windows/drivers/adreno/requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Get-Command glslangValidator -ErrorAction SilentlyContinue)) {
            $spec = (Get-Content config/windows-graphics.json -Raw | ConvertFrom-Json).glslang_windows_host
            $cache = New-Item -Force -ItemType Directory build/source-cache/windows-graphics
            $zip = Join-Path $cache.FullName (([Uri]$spec.url).Segments[-1])
            if (!(Test-Path $zip)) { Invoke-WebRequest $spec.url -OutFile $zip }
            if ((Get-FileHash $zip).Hash -ne $spec.sha256) { throw 'glslang archive checksum mismatch' }
            Expand-Archive -Force $zip build/windows/glslang
            $glslang = Get-ChildItem build/windows/glslang -Recurse -Filter glslang.exe | Select-Object -First 1
            if (!$glslang) { throw 'Missing glslang host tool' }
            if (!(Test-Path "$($glslang.DirectoryName)/glslangValidator.exe")) {
              Copy-Item $glslang.FullName "$($glslang.DirectoryName)/glslangValidator.exe"
            }
            $env:PATH = "$($glslang.DirectoryName);$env:PATH"
          }
          $rc = Get-Command llvm-windres -ErrorAction SilentlyContinue
          if ($rc) { $resourceCompiler = $rc.Source }
          else { $resourceCompiler = Join-Path $sdkRoot "bin/$($sdk.Name)/arm64/rc.exe" }
          $env:INCLUDE = "$($sdk.FullName)/um;$($sdk.FullName)/shared;$($sdk.FullName)/ucrt;$env:INCLUDE"
          bash ./build.sh windows graphics-umd --component all --windres $resourceCompiler --vc-tools $vc.FullName --kit-include $wdk.FullName --kit-include $sdk.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Load both graphics drivers on ARM64 Windows
        shell: pwsh
        run: |
          $dir = (Resolve-Path artifacts/windows/drivers/adreno/Release).Path
          $icd = (Get-Content "$dir/freedreno_icd.json" -Raw | ConvertFrom-Json).ICD.library_path
          $drivers = @{
            'a830_umd_arm64.dll' = @('OpenAdapter10','OpenAdapter10_2');
            $icd = @('vk_icdNegotiateLoaderICDInterfaceVersion','vk_icdGetInstanceProcAddr','A830SetHost')
          }
          foreach ($driver in $drivers.Keys) {
            $handle = [System.Runtime.InteropServices.NativeLibrary]::Load((Join-Path $dir $driver))
            try {
              foreach ($name in $drivers[$driver]) {
                [void][System.Runtime.InteropServices.NativeLibrary]::GetExport($handle, $name)
              }
            } finally { [System.Runtime.InteropServices.NativeLibrary]::Free($handle) }
          }
