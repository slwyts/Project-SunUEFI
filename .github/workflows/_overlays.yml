name: Native distribution overlay packages

on:
  workflow_call:
    inputs:
      image_id:
        required: true
        type: string
      cache_key:
        required: true
        type: string
      matrix:
        required: true
        type: string

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      SUNUEFI_BUILD_TARGET: ${{ matrix.target }}
      SUNUEFI_BUILD_ENVIRONMENT_ID: ${{ inputs.image_id }}
      SUNUEFI_CACHE_WORKSPACE: /workspace
      SUNUEFI_OVERLAY_RELEASE: ${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - id: generation
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/packages/overlays/${{ matrix.target }}
          key: repo-packages-v1-${{ github.run_id }}-${{ matrix.target }}
      - id: manifest
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/packages/overlays/${{ matrix.target }}/manifest.json
          key: repo-manifest-v1-${{ github.run_id }}-${{ matrix.target }}
          lookup-only: true
      - name: Restore the builder for a new package generation
        if: steps.generation.outputs.cache-hit != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - id: inputs
        if: steps.generation.outputs.cache-hit != 'true'
        run: |
          python3 tools/build/ci_container.py load
          ./build.sh sources
          python3 tools/build/shared_products.py keys --github-output "$GITHUB_OUTPUT"
      - if: steps.generation.outputs.cache-hit != 'true'
        uses: ./.github/actions/restore-shared-product
        with:
          kind: kernel
          key: ${{ steps.inputs.outputs.kernel_key }}
      - if: steps.generation.outputs.cache-hit != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/toolchains/*.tar.zst
          key: llvm-arm64-${{ hashFiles('config/kernel-llvm.json', 'tools/desktop/prepare_kernel_llvm.py') }}
          fail-on-cache-miss: true
      - if: steps.generation.outputs.cache-hit != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ccache
          key: ccache-${{ runner.arch }}-overlays-${{ matrix.target }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.arch }}-overlays-${{ matrix.target }}-
      - name: Restore the last completed overlay package set
        if: steps.generation.outputs.cache-hit != 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/overlay-cache/${{ matrix.target }}
          key: overlay-inputs-v1-${{ matrix.target }}-${{ inputs.image_id }}-run-${{ github.run_id }}
          restore-keys: overlay-inputs-v1-${{ matrix.target }}-${{ inputs.image_id }}-
      - name: Build and seal the native overlay packages
        if: steps.generation.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p build/logs build/ccache
          docker run --rm --privileged -v "$PWD:/workspace" -w /workspace \
            -e SUNUEFI_BUILD_ENVIRONMENT_ID -e SUNUEFI_BUILD_TARGET \
            -e SUNUEFI_OVERLAY_RELEASE \
            -e SUNUEFI_TOOLCHAIN_ROOT=/usr \
            -e CCACHE_DIR=/workspace/build/ccache -e CCACHE_MAXSIZE=3G \
            -e CCACHE_BASEDIR=/workspace -e CCACHE_COMPILERCHECK=content \
            sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "/workspace/*"
              python3 -m venv .venv
              .venv/bin/pip install -r requirements-build.txt
              . .venv/bin/activate
              python3 tools/build/shared_products.py verify --kind kernel
              output="artifacts/packages/overlays/$SUNUEFI_BUILD_TARGET"
              case "$SUNUEFI_BUILD_TARGET" in
                debian-gnome) ./build.sh release-rootfs --desktop gnome --packages-only "$output" ;;
                nyarch-gnome|steamos) ./build.sh "$SUNUEFI_BUILD_TARGET-rootfs" --packages-only "$output" ;;
              esac
            ' 2>&1 | tee build/logs/overlay-packages.log
      - name: Verify the package set and hashes
        run: |
          ./build.sh repo products --verify-target "$SUNUEFI_BUILD_TARGET" \
            --output "artifacts/packages/overlays/$SUNUEFI_BUILD_TARGET"
      - id: completed
        name: Stage the verified overlay set for reuse across runs
        if: steps.generation.outputs.cache-hit != 'true'
        run: |
          packages="artifacts/packages/overlays/$SUNUEFI_BUILD_TARGET"
          cache="build/overlay-cache/$SUNUEFI_BUILD_TARGET"
          mkdir -p build/overlay-cache
          if [ -e "$cache" ] || [ -L "$cache" ]; then
            mv -T -- "$cache" "$cache.previous"
          fi
          cp -R -- "$packages" "$cache"
          read -r digest _ < <(sha256sum "$cache/manifest.json")
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Cache the verified overlay package set
        if: steps.completed.outputs.digest != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/overlay-cache/${{ matrix.target }}
          key: overlay-inputs-v1-${{ matrix.target }}-${{ inputs.image_id }}-${{ steps.completed.outputs.digest }}
      - name: Save exact archives for publication
        if: steps.generation.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/packages/overlays/${{ matrix.target }}
          key: repo-packages-v1-${{ github.run_id }}-${{ matrix.target }}
      - name: Save only metadata for image assembly
        if: steps.manifest.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/packages/overlays/${{ matrix.target }}/manifest.json
          key: repo-manifest-v1-${{ github.run_id }}-${{ matrix.target }}
      - name: Stage package build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-logs-overlays-${{ matrix.target }}
          path: |
            build/logs/
            build/distros/overlays/*.build.log
            build/distros/overlays/${{ matrix.target }}/packages/*/build.log
            build/distros/overlays/${{ matrix.target }}/packages/*/SOURCE.json
            artifacts/packages/overlays/${{ matrix.target }}/manifest.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
