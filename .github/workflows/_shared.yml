name: Shared firmware and kernel

on:
  workflow_call:
    inputs:
      image_id:
        required: true
        type: string
      cache_key:
        required: true
        type: string
      shared_matrix:
        required: true
        type: string
    outputs:
      bsp_key:
        description: Exact cache key for shared device configuration and audio topology packages
        value: ${{ jobs.bsp.outputs.key }}
      camera_key:
        description: Exact cache key for both native camera archives
        value: ${{ jobs.bsp.outputs.camera_key }}

permissions:
  contents: read

jobs:
  bsp:
    name: Device packages
    if: contains(fromJSON(inputs.shared_matrix).kind, 'kernel')
    runs-on: ubuntu-26.04-arm
    outputs:
      key: ${{ steps.restore.outputs.cache-primary-key }}
      camera_key: ${{ steps.camera.outputs.cache-primary-key }}
    env:
      SUNUEFI_BUILD_ENVIRONMENT_ID: ${{ inputs.image_id }}
      SUNUEFI_CACHE_WORKSPACE: /workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/packages/bsp
          # Reusing a previous run's package after a source revert would
          # leave the signed pacman database on the newer package version.
          key: repo-bsp-v2-${{ github.run_id }}
      - name: Check out the fixed AudioReach sources
        if: steps.restore.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 -- upstream/debian-piano-current upstream/audioreach-topology
      - id: camera-key
        name: Identify the camera source, recipe and toolchain
        run: |
          key=$(./build.sh camera-package --cache-key)
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - id: camera
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/packages/camera
          key: ${{ steps.camera-key.outputs.key }}
      - name: Build or verify the native device packages
        env:
          SUNUEFI_OVERLAY_RELEASE: ${{ github.run_id }}.${{ github.run_attempt }}
          BSP_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CAMERA_CACHE_HIT: ${{ steps.camera.outputs.cache-hit }}
        run: |
          python3 tools/build/ci_container.py load
          mkdir -p artifacts/packages/bsp
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e SUNUEFI_BUILD_ENVIRONMENT_ID -e SUNUEFI_CACHE_WORKSPACE \
            -e SUNUEFI_OVERLAY_RELEASE -e BSP_CACHE_HIT -e CAMERA_CACHE_HIT sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              if [ "$BSP_CACHE_HIT" != true ]; then
                git config --global --add safe.directory /workspace/upstream/debian-piano-current
                git config --global --add safe.directory /workspace/upstream/audioreach-topology
                ./build.sh bsp package --target debian --format deb --output artifacts/packages/bsp/debian
                ./build.sh bsp package --target arch --format pacman --output artifacts/packages/bsp/pacman
                ./build.sh bsp package --audio-topology --target debian --format deb --output artifacts/packages/bsp/audio-topology/debian
                ./build.sh bsp package --audio-topology --target arch --format pacman --output artifacts/packages/bsp/audio-topology/pacman
              fi
              ./build.sh repo products --verify-bsp --output artifacts/packages/bsp
              if [ "$CAMERA_CACHE_HIT" = true ]; then
                ./build.sh camera-package --verify
              else
                ./build.sh camera-package
              fi
            '
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/packages/bsp
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - if: steps.camera.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/packages/camera
          key: ${{ steps.camera.outputs.cache-primary-key }}

  shared:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.shared_matrix) }}
    env:
      SUNUEFI_BUILD_ENVIRONMENT_ID: ${{ inputs.image_id }}
      SUNUEFI_CACHE_WORKSPACE: /workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - name: Load the verified builder image
        run: python3 tools/build/ci_container.py load
      - name: Get only required fixed sources
        run: ./build.sh sources
      - id: keys
        run: python3 tools/build/shared_products.py keys --github-output "$GITHUB_OUTPUT"
      - id: completed
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            artifacts/product
            artifacts/android
            artifacts/simpleinit/product
            artifacts/kernels/release
            artifacts/packages/kernel
            build/shared-products/${{ matrix.kind }}.json
            build/kernels/release/.config
            build/kernels/release/Makefile
            build/kernels/release/Module.symvers
            build/kernels/release/include
            build/kernels/release/scripts
            build/kernels/release/arch/arm64/include/generated
            build/kernel-sources
          key: ${{ matrix.kind == 'firmware' && steps.keys.outputs.firmware_key || steps.keys.outputs.kernel_key }}
      - name: Restore reusable firmware workspace objects
        if: matrix.kind == 'firmware' && steps.completed.outputs.cache-hit != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/firmware-workspace
            build/android-product-module
          key: firmware-objects-arm64-${{ inputs.image_id }}-${{ steps.keys.outputs.firmware_key }}
          restore-keys: |
            firmware-objects-arm64-${{ inputs.image_id }}-
      - id: llvm
        if: matrix.kind == 'kernel'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/toolchains/*.tar.zst
          key: llvm-arm64-${{ hashFiles('config/kernel-llvm.json', 'tools/desktop/prepare_kernel_llvm.py') }}
      - name: Restore ccache only when building the kernel
        if: matrix.kind == 'kernel' && steps.completed.outputs.cache-hit != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ccache
          key: ccache-arm64-shared-kernel-${{ steps.keys.outputs.kernel_key }}
          restore-keys: |
            ccache-arm64-shared-kernel-
      - name: Build each common product once, or validate its cache
        env:
          SHARED_KIND: ${{ matrix.kind }}
        run: |
          set -o pipefail
          mkdir -p build/logs build/ccache artifacts/downloads
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            -e SUNUEFI_BUILD_ENVIRONMENT_ID -e SHARED_KIND \
            -e CCACHE_DIR=/workspace/build/ccache -e CCACHE_MAXSIZE=3G \
            -e CCACHE_BASEDIR=/workspace -e CCACHE_COMPILERCHECK=content \
            -e SUNUEFI_TOOLCHAIN_ROOT=/usr sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "/workspace/*"
              python3 -m venv .venv
              .venv/bin/pip install -r requirements-build.txt
              . .venv/bin/activate
              python3 tools/build/shared_products.py ensure --kind "$SHARED_KIND"
            ' 2>&1 | tee "build/logs/shared-$SHARED_KIND.log"
      - name: Save the validated shared generation once
        if: steps.completed.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            artifacts/product
            artifacts/android
            artifacts/simpleinit/product
            artifacts/kernels/release
            artifacts/packages/kernel
            build/shared-products/${{ matrix.kind }}.json
            build/kernels/release/.config
            build/kernels/release/Makefile
            build/kernels/release/Module.symvers
            build/kernels/release/include
            build/kernels/release/scripts
            build/kernels/release/arch/arm64/include/generated
            build/kernel-sources
          key: ${{ matrix.kind == 'firmware' && steps.keys.outputs.firmware_key || steps.keys.outputs.kernel_key }}
      - name: Save fixed LLVM downloads once
        if: matrix.kind == 'kernel' && steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/toolchains/*.tar.zst
          key: llvm-arm64-${{ hashFiles('config/kernel-llvm.json', 'tools/desktop/prepare_kernel_llvm.py') }}
      - name: Stage the shared firmware downloads
        if: matrix.kind == 'firmware'
        run: |
          mkdir -p artifacts/downloads/module artifacts/downloads/uefi
          cp artifacts/android/SunUEFI-Piano-*.zip artifacts/downloads/module/
          cp artifacts/product/PianoUEFI-product.img artifacts/downloads/uefi/SunUEFI-UEFI-Fastboot.img
          cp uefi/components/product-support/Library/ConsoleScale/OFL.txt artifacts/downloads/uefi/
      - name: Android assistant module
        if: matrix.kind == 'firmware'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-Module
          path: artifacts/downloads/module/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: UEFI for fastboot boot
        if: matrix.kind == 'firmware'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-UEFI-Fastboot
          path: artifacts/downloads/uefi/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Stage shared build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-logs-shared-${{ matrix.kind }}
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
