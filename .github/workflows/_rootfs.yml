name: Distribution images from signed packages

on:
  workflow_call:
    inputs:
      image_id:
        required: true
        type: string
      cache_key:
        required: true
        type: string
      matrix:
        required: true
        type: string
      shared_target:
        required: true
        type: string
      bsp_key:
        required: true
        type: string
      camera_key:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      SUNUEFI_BUILD_TARGET: ${{ matrix.target }}
      SUNUEFI_OVERLAY_TARGET: ${{ startsWith(matrix.target, 'debian-') && 'debian-gnome' || matrix.target }}
      SUNUEFI_BUILD_ENVIRONMENT_ID: ${{ inputs.image_id }}
      SUNUEFI_CACHE_WORKSPACE: /workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - id: keys
        run: |
          python3 tools/build/ci_container.py load
          ./build.sh sources
          python3 tools/build/shared_products.py keys --github-output "$GITHUB_OUTPUT"
      - uses: ./.github/actions/restore-shared-product
        with:
          kind: firmware
          key: ${{ steps.keys.outputs.firmware_key }}
      - uses: ./.github/actions/restore-shared-product
        with:
          kind: kernel
          key: ${{ steps.keys.outputs.kernel_key }}
      - name: Restore the shared device configuration and audio topology packages
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/packages/bsp
          key: ${{ inputs.bsp_key }}
          fail-on-cache-miss: true
      - name: Restore the shared camera packages for image verification
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/packages/camera
          key: ${{ inputs.camera_key }}
          fail-on-cache-miss: true
      - name: Restore the record of the published overlay packages
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/packages/overlays/${{ env.SUNUEFI_OVERLAY_TARGET }}/manifest.json
          key: repo-manifest-v1-${{ github.run_id }}-${{ env.SUNUEFI_OVERLAY_TARGET }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/toolchains/*.tar.zst
          key: llvm-arm64-${{ hashFiles('config/kernel-llvm.json', 'tools/desktop/prepare_kernel_llvm.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ccache
          key: ccache-${{ runner.arch }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.arch }}-${{ matrix.target }}-
      - name: Assemble the image using the verified package generation
        run: |
          set -o pipefail
          mkdir -p build/logs build/ccache artifacts/downloads
          docker run --rm --privileged -v "$PWD:/workspace" -w /workspace \
            -e SUNUEFI_BUILD_ENVIRONMENT_ID -e SUNUEFI_CACHE_WORKSPACE -e SUNUEFI_TOOLCHAIN_ROOT=/usr \
            -e SUNUEFI_BUILD_TARGET -e SUNUEFI_OVERLAY_TARGET \
            -e CCACHE_DIR=/workspace/build/ccache -e CCACHE_MAXSIZE=3G \
            -e CCACHE_BASEDIR=/workspace -e CCACHE_COMPILERCHECK=content \
            sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "/workspace/*"
              python3 -m venv .venv
              .venv/bin/pip install -r requirements-build.txt
              . .venv/bin/activate
              python3 tools/build/shared_products.py verify --kind firmware
              python3 tools/build/shared_products.py verify --kind kernel
              packages="artifacts/packages/overlays/$SUNUEFI_OVERLAY_TARGET/manifest.json"
              case "$SUNUEFI_BUILD_TARGET" in
                steamos|nyarch-gnome)
                  ./build.sh "$SUNUEFI_BUILD_TARGET-rootfs" --published-packages "$packages"
                  root="build/distros/$SUNUEFI_BUILD_TARGET-piano"
                  ./build.sh package --rootfs "$root/rootfs" --rootfs-manifest "$root/manifest.json" \
                    --initramfs "$root/initramfs/initramfs.cpio.gz" --root-size-mib 16384
                  ;;
                debian-gnome|debian-kde)
                  ./build.sh release-rootfs --desktop "${SUNUEFI_BUILD_TARGET#debian-}" \
                    --published-packages "$packages"
                  ./build.sh package --root-size-mib 8192
                  ;;
              esac
              python3 tools/package_sparse_images.py --bundle artifacts/release --output artifacts/fastboot-sparse
            ' 2>&1 | tee build/logs/ci-build.log
      - name: Prepare the product downloads
        run: |
          mkdir -p artifacts/downloads/esp artifacts/downloads/root
          cp artifacts/fastboot-sparse/esp.img artifacts/downloads/esp/esp.sparse.img
          cp artifacts/fastboot-sparse/root.ext4.img "artifacts/downloads/root/root-${SUNUEFI_BUILD_TARGET}.sparse.img"
      - name: Shared sparse ESP
        if: matrix.target == inputs.shared_target
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-ESP
          path: artifacts/downloads/esp/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Distribution sparse root
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-Root-${{ matrix.target }}
          path: artifacts/downloads/root/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Stage build logs and manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-logs-${{ matrix.target }}
          path: |
            build/logs/
            build/distros/release.build.log
            build/distros/*/manifest.json
            build/distros/*/FAILED.json
            build/distros/*/packages.tsv
            build/distros/*/runtime/manifest.json
            build/release/source-manifest.json
            artifacts/packages/overlays/${{ env.SUNUEFI_OVERLAY_TARGET }}/manifest.json
            artifacts/kernels/release/manifest.json
            artifacts/release/manifest.json
            artifacts/fastboot-sparse/manifest.json
            artifacts/fastboot-sparse/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
