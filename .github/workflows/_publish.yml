name: Publish signed native packages

on:
  workflow_call:
    inputs:
      image_id:
        required: true
        type: string
      overlay_matrix:
        required: true
        type: string
    secrets:
      SUNUEFI_REPO_GPG_KEY:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04-arm
    env:
      SUNUEFI_BUILD_ENVIRONMENT_ID: ${{ inputs.image_id }}
      SUNUEFI_CACHE_WORKSPACE: /workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - uses: ./.github/actions/build-input
        with:
          operation: download
          name: builder
      - name: Load the verified builder
        run: python3 tools/build/ci_container.py load
      - uses: ./.github/actions/build-input
        with:
          operation: download
          name: kernel
      - name: Restore fixed LLVM for kernel verification
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/toolchains/*.tar.zst
          key: llvm-arm64-${{ hashFiles('config/kernel-llvm.json', 'tools/desktop/prepare_kernel_llvm.py') }}
      - name: Download this run's shared device packages
        uses: ./.github/actions/build-input
        with:
          operation: download
          name: devices
      - if: contains(fromJSON(inputs.overlay_matrix).target, 'debian-gnome')
        uses: ./.github/actions/build-input
        with:
          operation: download
          name: overlay-debian-gnome
      - if: contains(fromJSON(inputs.overlay_matrix).target, 'nyarch-gnome')
        uses: ./.github/actions/build-input
        with:
          operation: download
          name: overlay-nyarch-gnome
      - if: contains(fromJSON(inputs.overlay_matrix).target, 'steamos')
        uses: ./.github/actions/build-input
        with:
          operation: download
          name: overlay-steamos
      - if: contains(fromJSON(inputs.overlay_matrix).target, 'debian-denial')
        uses: ./.github/actions/build-input
        with:
          operation: download
          name: overlay-debian-denial
      - if: contains(fromJSON(inputs.overlay_matrix).target, 'arch-denial')
        uses: ./.github/actions/build-input
        with:
          operation: download
          name: overlay-arch-denial
      - name: Sign, upload and check all selected package indexes
        env:
          SUNUEFI_REPO_GPG_KEY: ${{ secrets.SUNUEFI_REPO_GPG_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          OVERLAYS: ${{ inputs.overlay_matrix }}
        run: |
          set -o pipefail
          mkdir -p build/logs
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e SUNUEFI_REPO_GPG_KEY -e R2_ACCESS_KEY_ID -e R2_SECRET_ACCESS_KEY \
            -e R2_ENDPOINT -e R2_BUCKET -e OVERLAYS \
            -e SUNUEFI_BUILD_ENVIRONMENT_ID -e SUNUEFI_CACHE_WORKSPACE sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /workspace/build/kernel-sources/linux-piano.git
              git config --global --add safe.directory "/workspace/build/kernel-worktrees/*"
              python3 tools/build/shared_products.py verify --kind kernel
              python3 -m venv /tmp/repo-venv
              /tmp/repo-venv/bin/pip install -r requirements-build.txt
              . /tmp/repo-venv/bin/activate
              ./build.sh repo products --kernel --overlay-matrix "$OVERLAYS" --output build/repository
            ' 2>&1 | tee build/logs/repository.log
      - name: Collect the published package manifests
        id: published
        if: fromJSON(inputs.overlay_matrix).target[0] != null
        env:
          OVERLAYS: ${{ inputs.overlay_matrix }}
        run: |
          paths=$(jq -er '.target[] | "artifacts/packages/overlays/\(.)/manifest.json"' <<< "$OVERLAYS")
          {
            printf 'paths<<MANIFESTS\n%s\nMANIFESTS\n' "$paths"
          } >> "$GITHUB_OUTPUT"
      - name: Transfer published manifests to image assembly
        if: steps.published.outputs.paths != ''
        uses: ./.github/actions/build-input
        with:
          operation: upload
          name: published-overlay-manifests
          paths: ${{ steps.published.outputs.paths }}
      - name: Stage repository publication logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-logs-repository
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
