name: Windows driver checks

on:
  push:
    branches: [woa]
    paths: &graphics_paths
      - 'windows/drivers/**'
      - 'vendor/firmware/piano-qcom/gen80000_gmu.bin'
      - 'vendor/firmware/piano-keyboard/MCU_Upgrade.bin'
      - 'vendor/piano/dtb/xbl-config.dtb'
      - 'vendor/piano/dtb/piano.dtb'
      - 'vendor/piano/native/ClockDxe.efi'
      - 'tools/compose_piano_dtb.py'
      - 'tests/unit/test_gmu_firmware.py'
      - 'tests/unit/test_gmu_memory_layout.py'
      - 'tests/unit/test_hfi_queue.py'
      - 'tests/unit/test_hfi_perf_table.py'
      - 'tests/unit/test_wn8030_input.py'
      - 'tests/unit/test_wn8030_boot.py'
      - 'tests/native/Wn8030ReportsTest.c'
      - 'tests/native/UfsTransferTest.c'
      - 'tests/unit/test_ufs_transfer.py'
      - 'tests/native/UfsLinkTest.c'
      - 'tests/unit/test_ufs_link.py'
      - 'tests/native/UfsPlatformTest.c'
      - 'tests/unit/test_ufs_platform.py'
      - 'tests/native/PianoUfsClockTest.c'
      - 'tests/unit/test_piano_ufs_clock.py'
      - 'tests/native/PianoUfsPowerTest.c'
      - 'tests/native/test_windows_driver_catalog.py'
      - 'tests/unit/test_piano_ufs_power.py'
      - 'tests/native/PianoQupPowerTest.c'
      - 'tests/unit/test_piano_qup_power.py'
      - 'tests/native/Rpmh*Test.c'
      - 'tests/unit/test_rpmh_provider.py'
      - 'tests/native/UfsControllerTest.c'
      - 'tests/unit/test_ufs_controller.py'
      - 'tools/build/windows.py'
      - 'build.sh'
      - '.github/workflows/windows-graphics.yml'
  pull_request:
    branches: [woa, main]
    paths: *graphics_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-graphics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the UFS controller model
        run: |
          if ! command -v qemu-system-aarch64 >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qemu-system-arm
          fi
      - run: >-
          ./build.sh check --group python-all --no-skips --pattern test_gmu_firmware.py
          --pattern test_gmu_memory_layout.py --pattern test_hfi_queue.py --pattern test_hfi_perf_table.py
          --pattern test_wn8030_input.py --pattern test_wn8030_boot.py
          --pattern test_ufs_transfer.py --pattern test_ufs_link.py --pattern test_ufs_platform.py
          --pattern test_piano_ufs_clock.py --pattern test_piano_ufs_power.py --pattern test_ufs_controller.py
          --pattern test_piano_qup_power.py --pattern test_rpmh_provider.py
  readback:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the ARM64 graphics test
        shell: bash
        run: ./build.sh windows graphics-test
      - name: Restore the ARM64 driver build inputs
        id: kits
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/windows/nuget/*/c/Include/*/km
            build/windows/nuget/*/c/Include/*/shared
            build/windows/nuget/*/c/Include/*/ucrt
            build/windows/nuget/*/c/Include/wdf/kmdf
            build/windows/nuget/*/c/Lib/*/km/ARM64/*.lib
            build/windows/nuget/*/c/Lib/wdf/kmdf/ARM64
            build/windows/nuget/*/c/bin/*/x86
          key: windows-arm64-wdk-package-${{ hashFiles('windows/drivers/packages.config') }}
      - if: steps.kits.outputs.cache-hit != 'true'
        run: nuget restore windows/drivers/packages.config -PackagesDirectory build/windows/nuget -NonInteractive
      - name: Compile the ARM64 kernel driver components
        shell: bash
        run: |
          opts=()
          for kit in build/windows/nuget/*/c/Include/[0-9]*; do
            [[ -d "$kit" ]] && opts+=(--kit-include "$kit")
          done
          ./build.sh windows drivers "${opts[@]}" --catalogs
      - name: Verify the ARM64 KMDF and Storport drivers
        shell: pwsh
        run: |
          $pe = llvm-readobj --file-headers --coff-imports artifacts/windows/drivers/wn8030/Release/wn8030.sys | Out-String
          if ($LASTEXITCODE -ne 0 -or $pe -notmatch 'Machine: IMAGE_FILE_MACHINE_ARM64' -or
              $pe -notmatch 'Subsystem: IMAGE_SUBSYSTEM_NATIVE' -or $pe -notmatch 'Symbol: WdfLdrQueryInterface') {
            throw 'Expected an ARM64 kernel driver linked against KMDF.'
          }
          $rpmh = llvm-readobj --file-headers --coff-imports artifacts/windows/drivers/rpmh/Release/sunrpmh.sys | Out-String
          if ($LASTEXITCODE -ne 0 -or $rpmh -notmatch 'Machine: IMAGE_FILE_MACHINE_ARM64' -or
              $rpmh -notmatch 'Subsystem: IMAGE_SUBSYSTEM_NATIVE' -or $rpmh -notmatch 'Symbol: WdfLdrQueryInterface') {
            throw 'Expected the ARM64 RPMh platform driver linked against KMDF.'
          }
          $storage = 'artifacts/windows/drivers/ufs/Release'
          $pe = llvm-readobj --file-headers --coff-imports "$storage/sunufs.sys" | Out-String
          if ($LASTEXITCODE -ne 0 -or $pe -notmatch 'Machine: IMAGE_FILE_MACHINE_ARM64' -or
              $pe -notmatch 'Subsystem: IMAGE_SUBSYSTEM_NATIVE' -or $pe -notmatch 'Symbol: StorPortInitialize' -or
              !(Test-Path "$storage/sunufs.inf") -or !(Test-Path "$storage/sunufs.cat")) {
            throw 'Expected an ARM64 Storport miniport, its INF and its WDK catalog.'
          }
          python tests/native/test_windows_driver_catalog.py "$storage/sunufs.cat" "$storage/sunufs.inf" "$storage/sunufs.sys"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check Direct3D readback using the software adapter
        run: .\artifacts\windows\tests\graphics-readback.exe --warp
      - name: Compare a D3D12 queue timestamp with its clock calibration on WARP
        run: .\artifacts\windows\tests\graphics-readback.exe --warp --api 12-timestamps
      - name: Save the verified UFS package for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Windows-ARM64-UFS-unsigned
          path: |
            artifacts/windows/drivers/ufs/Release/sunufs.inf
            artifacts/windows/drivers/ufs/Release/sunufs.sys
            artifacts/windows/drivers/ufs/Release/sunufs.cat
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Windows-ARM64-graphics-readback
          path: artifacts/windows/tests/graphics-readback.exe
          if-no-files-found: error
          retention-days: 7
