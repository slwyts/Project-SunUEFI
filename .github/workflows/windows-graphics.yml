name: Windows graphics checks

on:
  push:
    branches: [woa]
    paths: &graphics_paths
      - 'windows/drivers/adreno/**'
      - 'windows/drivers/packages.config'
      - 'vendor/firmware/piano-qcom/gen80000_gmu.bin'
      - 'tests/unit/test_gmu_firmware.py'
      - 'tests/unit/test_gmu_memory_layout.py'
      - 'tests/unit/test_hfi_queue.py'
      - 'tools/build/windows.py'
      - 'build.sh'
      - '.github/workflows/windows-graphics.yml'
  pull_request:
    branches: [woa, main]
    paths: *graphics_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-graphics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./build.sh check --group python-all --no-skips --pattern test_gmu_firmware.py --pattern test_gmu_memory_layout.py --pattern test_hfi_queue.py
  readback:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the ARM64 graphics test
        shell: bash
        run: ./build.sh windows graphics-test
      - name: Restore the build-only WDK headers
        id: kits
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/windows/nuget/*/c/Include/*/km
            build/windows/nuget/*/c/Include/*/shared
            build/windows/nuget/*/c/Include/*/ucrt
          key: windows-arm64-wdk-headers-${{ hashFiles('windows/drivers/packages.config') }}
      - if: steps.kits.outputs.cache-hit != 'true'
        run: nuget restore windows/drivers/packages.config -PackagesDirectory build/windows/nuget -NonInteractive
      - name: Compile the ARM64 kernel driver components
        shell: bash
        run: |
          opts=()
          for kit in build/windows/nuget/*/c/Include/*; do
            [[ -d "$kit" ]] && opts+=(--kit-include "$kit")
          done
          ./build.sh windows drivers "${opts[@]}"
      - name: Check Direct3D readback using the software adapter
        run: .\artifacts\windows\tests\graphics-readback.exe --warp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Windows-ARM64-graphics-readback
          path: artifacts/windows/tests/graphics-readback.exe
          if-no-files-found: error
          retention-days: 7
