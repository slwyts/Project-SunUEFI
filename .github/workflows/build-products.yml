name: Build products

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-products.yml'
      - 'build.sh'
      - 'Makefile'
      - 'requirements-build.txt'
      - 'containers/**'
      - 'config/**'
      - 'sources.lock.json'
      - '.gitmodules'
      - 'patches/**'
      - 'uefi/**'
      - 'vendor/piano/**'
      - 'vendor/piano-linux/**'
      - 'vendor/firmware/**'
      - 'linux/**'
      - 'tools/**'
      - 'tests/unit/test_check_patch_series.py'
      - 'tests/unit/test_shared_products.py'
      - 'upstream/**'
      - 'android/**'
      - 'docs/user/install-from-artifact.md'
  workflow_dispatch:
    inputs:
      target:
        description: Product to build
        type: choice
        options: [all, uefi, linux, debian-gnome, debian-kde, nyarch-gnome, steamos]
        default: all

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      has_build: ${{ steps.targets.outputs.has_build }}
      matrix: ${{ steps.targets.outputs.matrix }}
      shared_target: ${{ steps.targets.outputs.shared_target }}
      shared_matrix: ${{ steps.targets.outputs.shared_matrix }}
      debian_cache_writer: ${{ steps.targets.outputs.debian_cache_writer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Check patch series and product references
        env:
          SUNUEFI_PATCH_BASE: ${{ github.event.before }}
        run: ./build.sh check --pattern test_check_patch_series.py
      - name: Check shared build cache rules
        run: ./build.sh check --group python-all --pattern test_shared_products.py
      - id: targets
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: python3 tools/ci_build_targets.py
  environment:
    needs: select
    if: needs.select.outputs.has_build == 'true'
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: build-products-${{ github.ref }}-environment
      cancel-in-progress: true
    outputs:
      image_id: ${{ steps.image.outputs.image_id }}
      cache_key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - id: cache-key
        env:
          BUILDER_INPUTS: ${{ hashFiles('containers/Dockerfile', 'config/build-container.json', 'tools/build_container.py', 'tools/build/ci_container.py', 'tools/build/shared_products.py') }}
        run: echo "key=builder-arm64-$BUILDER_INPUTS" >> "$GITHUB_OUTPUT"
      - id: cached-image
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ steps.cache-key.outputs.key }}
      - id: image
        name: Build or verify the shared builder image
        run: python3 tools/build/ci_container.py prepare --github-output "$GITHUB_OUTPUT"
      - name: Save the verified builder image once
        if: steps.cached-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ steps.cache-key.outputs.key }}

  shared:
    needs: [select, environment]
    if: needs.select.outputs.has_build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    concurrency:
      group: build-products-${{ github.ref }}-shared-${{ matrix.kind }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.shared_matrix) }}
    env:
      SUNUEFI_BUILD_ENVIRONMENT_ID: ${{ needs.environment.outputs.image_id }}
      SUNUEFI_CACHE_WORKSPACE: /workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ needs.environment.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Load the verified builder image
        run: python3 tools/build/ci_container.py load
      - name: Get only required fixed sources
        run: ./build.sh sources
      - id: keys
        run: python3 tools/build/shared_products.py keys --github-output "$GITHUB_OUTPUT"
      - id: completed
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            artifacts/product
            artifacts/android
            artifacts/simpleinit/product
            artifacts/kernels/release
            build/shared-products/${{ matrix.kind }}.json
            build/kernels/release/.config
            build/kernels/release/Makefile
            build/kernels/release/Module.symvers
            build/kernels/release/include
            build/kernels/release/scripts
            build/kernels/release/arch/arm64/include/generated
            build/kernel-sources
          key: ${{ matrix.kind == 'firmware' && steps.keys.outputs.firmware_key || steps.keys.outputs.kernel_key }}
      - name: Restore reusable firmware workspace objects
        if: matrix.kind == 'firmware'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/firmware-workspace
            build/android-product-module
          key: firmware-objects-arm64-${{ needs.environment.outputs.image_id }}-${{ github.sha }}
          restore-keys: |
            firmware-objects-arm64-${{ needs.environment.outputs.image_id }}-
      - id: llvm
        if: matrix.kind == 'kernel'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/toolchains/*.tar.zst
          key: llvm-arm64-${{ hashFiles('config/kernel-llvm.json', 'tools/desktop/prepare_kernel_llvm.py') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ccache
          key: ccache-arm64-shared-${{ matrix.kind }}-${{ github.sha }}
          restore-keys: |
            ccache-arm64-shared-${{ matrix.kind }}-
      - name: Build each common product once, or validate its cache
        env:
          SHARED_KIND: ${{ matrix.kind }}
        run: |
          set -o pipefail
          mkdir -p build/logs build/ccache
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            -e SUNUEFI_BUILD_ENVIRONMENT_ID -e SHARED_KIND \
            -e CCACHE_DIR=/workspace/build/ccache -e CCACHE_MAXSIZE=3G \
            -e CCACHE_BASEDIR=/workspace -e CCACHE_COMPILERCHECK=content \
            -e SUNUEFI_TOOLCHAIN_ROOT=/usr sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "/workspace/*"
              python3 -m venv .venv
              .venv/bin/pip install -r requirements-build.txt
              . .venv/bin/activate
              python3 tools/build/shared_products.py ensure --kind "$SHARED_KIND"
            ' 2>&1 | tee "build/logs/shared-$SHARED_KIND.log"
      - name: Save the validated shared generation once
        if: steps.completed.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            artifacts/product
            artifacts/android
            artifacts/simpleinit/product
            artifacts/kernels/release
            build/shared-products/${{ matrix.kind }}.json
            build/kernels/release/.config
            build/kernels/release/Makefile
            build/kernels/release/Module.symvers
            build/kernels/release/include
            build/kernels/release/scripts
            build/kernels/release/arch/arm64/include/generated
            build/kernel-sources
          key: ${{ matrix.kind == 'firmware' && steps.keys.outputs.firmware_key || steps.keys.outputs.kernel_key }}
      - name: Save fixed LLVM downloads once
        if: matrix.kind == 'kernel' && steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/toolchains/*.tar.zst
          key: llvm-arm64-${{ hashFiles('config/kernel-llvm.json', 'tools/desktop/prepare_kernel_llvm.py') }}
      - name: Stage shared build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-logs-shared-${{ matrix.kind }}
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  build:
    needs: [select, environment, shared]
    if: needs.select.outputs.has_build == 'true'
    concurrency:
      group: build-products-${{ github.ref }}-${{ matrix.target }}
      # Superseded images must not keep consuming paid runner time.
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      # TARGET is reserved by Cargo/bindgen for the compiler target triple.
      SUNUEFI_BUILD_TARGET: ${{ matrix.target }}
      SUNUEFI_BUILD_ENVIRONMENT_ID: ${{ needs.environment.outputs.image_id }}
      SUNUEFI_CACHE_WORKSPACE: /workspace
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - name: Get only required fixed sources
        run: ./build.sh sources
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ needs.environment.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Load the same verified builder image
        run: python3 tools/build/ci_container.py load
      - id: keys
        run: python3 tools/build/shared_products.py keys --github-output "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ccache
          key: ccache-${{ runner.arch }}-${{ env.SUNUEFI_BUILD_TARGET }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-${{ env.SUNUEFI_BUILD_TARGET }}-
      - name: Restore the single firmware and module generation
        if: matrix.target != 'linux'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            artifacts/product
            artifacts/android
            artifacts/simpleinit/product
            artifacts/kernels/release
            build/shared-products/firmware.json
            build/kernels/release/.config
            build/kernels/release/Makefile
            build/kernels/release/Module.symvers
            build/kernels/release/include
            build/kernels/release/scripts
            build/kernels/release/arch/arm64/include/generated
            build/kernel-sources
          key: ${{ steps.keys.outputs.firmware_key }}
          fail-on-cache-miss: true
      - name: Restore the matching kernel and external-module build files
        if: matrix.target != 'uefi'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            artifacts/product
            artifacts/android
            artifacts/simpleinit/product
            artifacts/kernels/release
            build/shared-products/kernel.json
            build/kernels/release/.config
            build/kernels/release/Makefile
            build/kernels/release/Module.symvers
            build/kernels/release/include
            build/kernels/release/scripts
            build/kernels/release/arch/arm64/include/generated
            build/kernel-sources
          key: ${{ steps.keys.outputs.kernel_key }}
          fail-on-cache-miss: true
      - name: Restore fixed kernel LLVM downloads
        if: matrix.target != 'uefi'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/toolchains/*.tar.zst
          key: llvm-arm64-${{ hashFiles('config/kernel-llvm.json', 'tools/desktop/prepare_kernel_llvm.py') }}
          fail-on-cache-miss: true
      - id: ffmpeg-cache
        name: Reuse completed Debian FFmpeg packages
        if: startsWith(matrix.target, 'debian-')
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/ffmpeg/runtime
            build/ffmpeg/SOURCE.json
            build/ffmpeg/SHA256SUMS
          key: ffmpeg-sid-arm64-${{ hashFiles('config/release.json', 'linux/rootfs/debian.json', 'linux/bsp/patches/ffmpeg/**', 'patches/ffmpeg/**', 'tools/build_ffmpeg_packages.py', 'tools/build/debian.py', 'tools/prepare_ffmpeg_source.py', 'tools/desktop/**', 'containers/Dockerfile', 'config/build-container.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ffmpeg-sid-arm64-${{ hashFiles('config/release.json', 'linux/rootfs/debian.json', 'linux/bsp/patches/ffmpeg/**', 'patches/ffmpeg/**', 'tools/build_ffmpeg_packages.py', 'tools/build/debian.py', 'tools/prepare_ffmpeg_source.py', 'tools/desktop/**', 'containers/Dockerfile', 'config/build-container.json') }}-
      - id: sensors-cache
        name: Reuse completed Debian hardware packages
        if: startsWith(matrix.target, 'debian-')
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/sensors/runtime
            build/sensors/SOURCE.json
            build/sensors/SOURCE
            build/sensors/SHA256SUMS
          key: sensors-sid-arm64-${{ hashFiles('sources.lock.json', 'config/release.json', 'linux/rootfs/debian.json', 'build.sh', 'patches/piano-sensors/**', 'tools/build/sensors.py', 'tools/build/debian.py', 'tools/desktop/**', 'containers/Dockerfile', 'config/build-container.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sensors-sid-arm64-${{ hashFiles('sources.lock.json', 'config/release.json', 'linux/rootfs/debian.json', 'build.sh', 'patches/piano-sensors/**', 'tools/build/sensors.py', 'tools/build/debian.py', 'tools/desktop/**', 'containers/Dockerfile', 'config/build-container.json') }}-
      - id: pipewire-cache
        name: Reuse completed Debian common desktop packages
        if: startsWith(matrix.target, 'debian-')
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/pipewire/runtime
            build/pipewire/SOURCE.json
          key: desktop-common-sid-arm64-${{ hashFiles('config/release.json', 'linux/rootfs/debian.json', 'patches/pipewire/**', 'tools/desktop/debian_package.py', 'tools/desktop/**', 'tools/build_gsd_packages.py', 'tools/build_mutter_packages.py', 'containers/Dockerfile', 'config/build-container.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            desktop-common-sid-arm64-${{ hashFiles('config/release.json', 'linux/rootfs/debian.json', 'patches/pipewire/**', 'tools/desktop/debian_package.py', 'tools/desktop/**', 'tools/build_gsd_packages.py', 'tools/build_mutter_packages.py', 'containers/Dockerfile', 'config/build-container.json') }}-
      - id: gnome-cache
        name: Reuse completed Debian GNOME packages
        if: matrix.target == 'debian-gnome'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/gsd/runtime
            build/gsd/SOURCE.json
            build/mutter/runtime
            build/mutter/SOURCE.json
            build/gdm/runtime
            build/gdm/SOURCE.json
          key: desktop-gnome-sid-arm64-${{ hashFiles('config/release.json', 'linux/rootfs/debian.json', 'patches/gnome-settings-daemon/**', 'patches/gdm/**', 'patches/mutter/**', 'linux/desktops/gnome/ambient-policy/**', 'linux/desktops/gnome/patches/mutter/**', 'tools/build_gsd_packages.py', 'tools/build_mutter_packages.py', 'tools/desktop/debian_package.py', 'tools/desktop/**', 'containers/Dockerfile', 'config/build-container.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            desktop-gnome-sid-arm64-${{ hashFiles('config/release.json', 'linux/rootfs/debian.json', 'patches/gnome-settings-daemon/**', 'patches/gdm/**', 'patches/mutter/**', 'linux/desktops/gnome/ambient-policy/**', 'linux/desktops/gnome/patches/mutter/**', 'tools/build_gsd_packages.py', 'tools/build_mutter_packages.py', 'tools/desktop/debian_package.py', 'tools/desktop/**', 'containers/Dockerfile', 'config/build-container.json') }}-
      - id: verify-shared
        name: Verify restored shared products without recompiling
        run: |
          set -o pipefail
          mkdir -p build/logs
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            -e SUNUEFI_BUILD_ENVIRONMENT_ID -e SUNUEFI_BUILD_TARGET \
            -e CCACHE_DIR=/workspace/build/ccache -e CCACHE_COMPILERCHECK=content \
            -e SUNUEFI_TOOLCHAIN_ROOT=/usr sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "/workspace/*"
              if [ "$SUNUEFI_BUILD_TARGET" != linux ]; then
                python3 tools/build/shared_products.py verify --kind firmware
              fi
              if [ "$SUNUEFI_BUILD_TARGET" != uefi ]; then
                python3 tools/build/shared_products.py verify --kind kernel
              fi
            ' 2>&1 | tee build/logs/shared-verification.log
      - name: Build selected product
        if: matrix.target != 'uefi' && matrix.target != 'linux'
        run: |
          set -o pipefail
          # The container writes as root; keep the host-side download staging
          # directory owned by the runner for the upload steps below.
          mkdir -p build/logs build/ccache artifacts/downloads
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            -e CCACHE_DIR=/workspace/build/ccache -e CCACHE_MAXSIZE=3G \
            -e CCACHE_BASEDIR=/workspace -e CCACHE_COMPILERCHECK=content \
            -e SUNUEFI_BUILD_ENVIRONMENT_ID -e SUNUEFI_TOOLCHAIN_ROOT=/usr \
            -e SUNUEFI_BUILD_TARGET sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "/workspace/*"
              python3 -m venv .venv
              .venv/bin/pip install -r requirements-build.txt
              . .venv/bin/activate
              case "$SUNUEFI_BUILD_TARGET" in
                steamos|nyarch-gnome)
                  ./build.sh "$SUNUEFI_BUILD_TARGET-rootfs"
                  ./build.sh package \
                    --rootfs "build/distros/$SUNUEFI_BUILD_TARGET-piano/rootfs" \
                    --rootfs-manifest "build/distros/$SUNUEFI_BUILD_TARGET-piano/manifest.json" \
                    --initramfs "build/distros/$SUNUEFI_BUILD_TARGET-piano/initramfs/initramfs.cpio.gz" \
                    --root-size-mib 16384
                  python3 tools/package_sparse_images.py --bundle artifacts/release --output artifacts/fastboot-sparse
                  ;;
                debian-gnome|debian-kde)
                  python3 -c "import sys; sys.path.insert(0, \"tools\"); from build_release_rootfs import require_host; require_host()"
                  ./build.sh release-rootfs --desktop "${SUNUEFI_BUILD_TARGET#debian-}"
                  ./build.sh package --root-size-mib 8192
                  python3 tools/package_sparse_images.py --bundle artifacts/release --output artifacts/fastboot-sparse
                  ;;
              esac
            ' 2>&1 | tee build/logs/ci-build.log
      - name: Save the validated FFmpeg generation once
        if: matrix.target == needs.select.outputs.debian_cache_writer
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
          path: |
            build/ffmpeg/runtime
            build/ffmpeg/SOURCE.json
            build/ffmpeg/SHA256SUMS
      - name: Save the validated sensor generation once
        if: matrix.target == needs.select.outputs.debian_cache_writer
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.sensors-cache.outputs.cache-primary-key }}
          path: |
            build/sensors/runtime
            build/sensors/SOURCE.json
            build/sensors/SOURCE
            build/sensors/SHA256SUMS
      - name: Save the validated PipeWire generation once
        if: matrix.target == needs.select.outputs.debian_cache_writer
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.pipewire-cache.outputs.cache-primary-key }}
          path: |
            build/pipewire/runtime
            build/pipewire/SOURCE.json
      - name: Save the validated GNOME generation once
        if: matrix.target == 'debian-gnome'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.gnome-cache.outputs.cache-primary-key }}
          path: |
            build/gsd/runtime
            build/gsd/SOURCE.json
            build/mutter/runtime
            build/mutter/SOURCE.json
            build/gdm/runtime
            build/gdm/SOURCE.json
      - name: Show failed build output
        if: failure()
        run: |
          if [ -f build/logs/ci-build.log ]; then
            tail -n 160 build/logs/ci-build.log
          fi
          for log in build/distros/release.build.log build/ffmpeg/build.log build/sensors/build.log build/gsd/build.log build/pipewire/build.log build/mutter/build.log build/gdm/build.log; do
            if [ -f "$log" ]; then
              echo "::group::$log"
              tail -n 100 "$log"
              echo "::endgroup::"
            fi
          done
      - name: Prepare shared downloads
        if: always() && steps.verify-shared.outcome == 'success' && matrix.target == needs.select.outputs.shared_target && matrix.target != 'linux'
        run: |
          mkdir -p artifacts/downloads/module artifacts/downloads/uefi artifacts/downloads/esp
          if [ -f artifacts/android/manifest.json ]; then
            cp artifacts/android/SunUEFI-Piano-*.zip artifacts/downloads/module/
          fi
          if [ -f artifacts/product/PianoUEFI-product.img ]; then
            cp artifacts/product/PianoUEFI-product.img artifacts/downloads/uefi/SunUEFI-UEFI-Fastboot.img
            cp uefi/components/product-support/Library/ConsoleScale/OFL.txt artifacts/downloads/uefi/
          fi
          if [ -f artifacts/fastboot-sparse/manifest.json ]; then
            cp artifacts/fastboot-sparse/esp.img artifacts/downloads/esp/esp.sparse.img
          fi
      - name: Android assistant module
        if: always() && steps.verify-shared.outcome == 'success' && matrix.target == needs.select.outputs.shared_target
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-Module
          path: artifacts/downloads/module/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: UEFI for fastboot boot
        if: always() && steps.verify-shared.outcome == 'success' && matrix.target == needs.select.outputs.shared_target
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-UEFI-Fastboot
          path: artifacts/downloads/uefi/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - name: Shared sparse ESP
        if: always() && steps.verify-shared.outcome == 'success' && matrix.target == needs.select.outputs.shared_target
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-ESP
          path: artifacts/downloads/esp/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 1
      - name: Prepare sparse root download
        if: startsWith(matrix.target, 'debian-') || matrix.target == 'steamos' || matrix.target == 'nyarch-gnome'
        run: |
          mkdir -p artifacts/downloads/root
          cp artifacts/fastboot-sparse/root.ext4.img "artifacts/downloads/root/root-${SUNUEFI_BUILD_TARGET}.sparse.img"
      - name: Distribution sparse root
        if: startsWith(matrix.target, 'debian-') || matrix.target == 'steamos' || matrix.target == 'nyarch-gnome'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SunUEFI-Root-${{ matrix.target }}
          path: artifacts/downloads/root/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Stage build logs for the combined archive
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-logs-${{ matrix.target }}
          path: |
            build/logs/
            sources.lock.json
            config/release.json
            config/steamos.json
            config/fingerprint.json
            config/nyarch.json
            build/distros/nyarch-gnome-piano/manifest.json
            build/distros/nyarch-gnome-piano/build.log
            build/distros/nyarch-gnome-piano/packages.tsv
            build/distros/nyarch-gnome-piano/packages/ffmpeg/SOURCE.json
            build/steamos-base/SOURCE.json
            build/distros/steamos-piano/manifest.json
            build/distros/steamos-piano/packages.tsv
            build/distros/steamos-piano/packages/ffmpeg/SOURCE.json
            linux/bsp/manifest.json
            linux/dts/piano-cpu-model.dtso
            linux/dts/piano-audio-dmic-clock.dtso
            build/release/source-manifest.json
            build/sensors/SOURCE.json
            build/sensors/SOURCE
            build/sensors/SHA256SUMS
            build/sensors/build.log
            build/ffmpeg/SOURCE.json
            build/ffmpeg/SHA256SUMS
            build/ffmpeg/build.log
            build/distros/release/manifest.json
            build/distros/release.build.log
            build/distros/release/FAILED.json
            build/gsd/SOURCE.json
            build/gsd/build.log
            build/gdm/SOURCE.json
            build/gdm/build.log
            build/distros/nyarch-gnome-piano/packages/gdm/SOURCE.json
            build/distros/nyarch-gnome-piano/packages/gdm/build.log
            build/pipewire/SOURCE.json
            build/pipewire/build.log
            build/distros/nyarch-gnome-piano/packages/pipewire/SOURCE.json
            build/distros/nyarch-gnome-piano/packages/pipewire/build.log
            build/distros/steamos-piano/packages/pipewire/SOURCE.json
            build/distros/steamos-piano/packages/pipewire/build.log
            build/distros/steamos-piano/rootfs/var/tmp/sunuefi-package-build/src/build/CMakeFiles/CMakeConfigureLog.yaml
            build/distros/nyarch-gnome-piano/packages/gnome-settings-daemon/manifest.json
            build/mutter/SOURCE.json
            build/mutter/SHA256SUMS
            build/mutter/build.log
            build/distros/release/packages.tsv
            build/distros/release/adapters/manifest.json
            build/distros/release/runtime/manifest.json
            artifacts/android/manifest.json
            build/android-product-module/manifest.json
            artifacts/product/manifest.json
            artifacts/kernels/release/config
            artifacts/kernels/release/manifest.json
            artifacts/release/manifest.json
            artifacts/fastboot-sparse/manifest.json
            artifacts/fastboot-sparse/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  logs:
    needs: [select, environment, shared, build]
    if: always() && needs.select.outputs.has_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Publish one logs.zip and remove intermediate log artifacts
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: logs
          pattern: build-logs-*
          separate-directories: true
          delete-merged: true
          retention-days: 7
          compression-level: 6
