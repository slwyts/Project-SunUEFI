name: Build products

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-products.yml'
      - 'build.sh'
      - 'Makefile'
      - 'requirements-build.txt'
      - 'containers/**'
      - 'config/**'
      - 'sources.lock.json'
      - '.gitmodules'
      - 'patches/**'
      - 'uefi/**'
      - 'vendor/piano/**'
      - 'vendor/piano-linux/**'
      - 'linux/**'
      - 'tools/**'
      - 'upstream/**'
      - 'android/native/piano-boot-request.c'
      - 'docs/user/install-from-artifact.md'
  workflow_dispatch:
    inputs:
      target:
        description: Product to build
        type: choice
        options: [uefi, linux, debian-gnome]
        default: uefi

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      has_build: ${{ steps.targets.outputs.has_build }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - id: targets
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: python3 tools/ci_build_targets.py
  build:
    needs: select
    if: needs.select.outputs.has_build == 'true'
    concurrency:
      group: build-products-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
    runs-on: ${{ matrix.target == 'debian-gnome' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - name: Get only required fixed sources
        run: ./build.sh sources
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ccache
          key: ccache-${{ runner.arch }}-${{ env.TARGET }}-${{ hashFiles('sources.lock.json', 'patches/**', 'config/build-container.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-${{ env.TARGET }}-${{ hashFiles('sources.lock.json', 'patches/**', 'config/build-container.json') }}-
      - name: Build the pinned-base environment
        run: docker build -t sunuefi-builder -f containers/Dockerfile .
      - name: Build selected product
        run: |
          set -o pipefail
          mkdir -p build/logs build/ccache
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            -e CCACHE_DIR=/workspace/build/ccache -e CCACHE_MAXSIZE=3G \
            -e TARGET sunuefi-builder bash -euc '
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "/workspace/*"
              python3 -m venv .venv
              .venv/bin/pip install -r requirements-build.txt
              . .venv/bin/activate
              case "$TARGET" in
                uefi)
                  ./build.sh uefi
                  ./build.sh installer --product artifacts/product/PianoUEFI-product.img
                  ;;
                linux)
                  ./build.sh linux
                  ;;
                debian-gnome)
                  ./build.sh uefi
                  ./build.sh linux
                  ./build.sh mesa
                  ./build.sh sensors
                  ./build.sh release-rootfs
                  ./build.sh package --root-size-mib 8192
                  ./build.sh installer --bundle artifacts/release-7.2.9
                  ;;
              esac
            ' 2>&1 | tee build/logs/ci-build.log
      - name: Show failed build output
        if: failure()
        run: |
          if [ -f build/logs/ci-build.log ]; then
            tail -n 160 build/logs/ci-build.log
          fi
      - name: Downloadable product and standalone installer
        if: matrix.target != 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: piano-${{ env.TARGET }}-${{ github.sha }}
          path: artifacts/installer/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Downloadable sensor runtime packages and source identity
        if: matrix.target == 'debian-gnome'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: piano-sensors-${{ github.sha }}
          path: |
            build/sensors/runtime/
            build/sensors/SOURCE
            build/sensors/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Downloadable standard GNOME packages and source identity
        if: matrix.target == 'debian-gnome'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: piano-gnome-packages-${{ github.sha }}
          path: |
            build/gsd/runtime/
            build/gsd/SOURCE.json
            build/mutter/runtime/
            build/mutter/SOURCE.json
            build/mutter/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Downloadable Linux Image, config and matching modules
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: piano-linux-${{ github.sha }}
          path: artifacts/kernels/release-7.2.9/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Keep build records and kernel outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: piano-build-records-${{ env.TARGET }}-${{ github.sha }}
          path: |
            build/logs/
            sources.lock.json
            config/release.json
            linux/bsp/manifest.json
            linux/dts/piano-cpu-model.dtso
            linux/dts/piano-audio-dmic-clock.dtso
            build/release-7.2.9/source-manifest.json
            build/mesa/SHA256SUMS
            build/sensors/SOURCE
            build/sensors/SHA256SUMS
            build/distros/release-7.2.9/manifest.json
            build/gsd/SOURCE.json
            build/mutter/SOURCE.json
            build/mutter/SHA256SUMS
            build/mutter/build.log
            build/distros/release-7.2.9/packages.tsv
            build/distros/release-7.2.9/adapters/manifest.json
            build/distros/release-7.2.9/runtime/manifest.json
            artifacts/product/manifest.json
            artifacts/kernels/release-7.2.9/Image
            artifacts/kernels/release-7.2.9/config
            artifacts/kernels/release-7.2.9/manifest.json
            artifacts/release-7.2.9/manifest.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
