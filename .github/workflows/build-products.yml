name: Build products

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'build.sh'
      - 'Makefile'
      - 'requirements-build.txt'
      - 'containers/**'
      - 'config/**'
      - 'sources.lock.json'
      - '.gitmodules'
      - 'patches/**'
      - 'uefi/**'
      - 'vendor/piano/**'
      - 'vendor/piano-linux/**'
      - 'vendor/firmware/**'
      - 'linux/**'
      - 'tools/**'
      - 'tests/unit/test_check_patch_series.py'
      - 'tests/unit/test_build_nyarch_apps.py'
      - 'tests/unit/test_kernel_package.py'
      - 'tests/unit/test_overlay_packages.py'
      - 'tests/unit/test_overlay_cache.py'
      - 'tests/unit/test_debian_overlay_cache.py'
      - 'tests/unit/test_repo*.py'
      - 'tests/unit/test_shared_products.py'
      - 'tests/unit/test_stage_arch_piano.py'
      - 'upstream/**'
      - 'android/**'
      - 'docs/user/install-from-artifact.md'
  workflow_dispatch:
    inputs:
      target:
        description: Product to build
        type: choice
        options: [all, uefi, linux, debian-gnome, debian-kde, nyarch-gnome, steamos]
        default: all

permissions:
  contents: read

# Keep the signed pacman index on this generation until its images are assembled.
concurrency:
  group: build-products-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-26.04
    outputs:
      has_build: ${{ steps.targets.outputs.has_build }}
      has_rootfs: ${{ steps.targets.outputs.has_rootfs }}
      rootfs_matrix: ${{ steps.targets.outputs.rootfs_matrix }}
      overlay_matrix: ${{ steps.targets.outputs.overlay_matrix }}
      shared_target: ${{ steps.targets.outputs.shared_target }}
      shared_matrix: ${{ steps.targets.outputs.shared_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Check patch series and product references
        env:
          SUNUEFI_PATCH_BASE: ${{ github.event.before }}
        run: ./build.sh check --pattern test_check_patch_series.py
      - name: Check shared build cache rules
        run: ./build.sh check --group python-all --pattern test_shared_products.py
      - id: targets
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: python3 tools/ci_build_targets.py
  environment:
    needs: select
    if: needs.select.outputs.has_build == 'true'
    runs-on: ubuntu-26.04-arm
    outputs:
      image_id: ${{ steps.image.outputs.image_id }}
      cache_key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - id: cache-key
        env:
          BUILDER_INPUTS: ${{ hashFiles('containers/Dockerfile', 'config/build-container.json', 'tools/build_container.py', 'tools/build/ci_container.py', 'tools/build/shared_products.py') }}
        run: echo "key=builder-arm64-$BUILDER_INPUTS" >> "$GITHUB_OUTPUT"
      - id: cached-image
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ steps.cache-key.outputs.key }}
      - id: image
        name: Build or verify the shared builder image
        run: python3 tools/build/ci_container.py prepare --github-output "$GITHUB_OUTPUT"
      - name: Save the verified builder image once
        if: steps.cached-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ steps.cache-key.outputs.key }}
      - name: Check signed APT and pacman publication with real tools
        run: |
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/workspace:ro" -w /workspace \
            sunuefi-builder ./build.sh check --group python-all --pattern 'test_repo*.py' \
              --pattern test_kernel_package.py --pattern 'test_overlay*.py' \
              --pattern test_debian_overlay_cache.py \
              --pattern test_build_nyarch_apps.py \
              --pattern test_stage_arch_piano.py

  shared:
    needs: [select, environment]
    if: needs.select.outputs.has_build == 'true'
    uses: ./.github/workflows/_shared.yml
    with:
      image_id: ${{ needs.environment.outputs.image_id }}
      cache_key: ${{ needs.environment.outputs.cache_key }}
      shared_matrix: ${{ needs.select.outputs.shared_matrix }}

  overlays:
    needs: [select, environment, shared]
    if: github.ref == 'refs/heads/main' && needs.select.outputs.has_rootfs == 'true'
    uses: ./.github/workflows/_overlays.yml
    with:
      image_id: ${{ needs.environment.outputs.image_id }}
      cache_key: ${{ needs.environment.outputs.cache_key }}
      matrix: ${{ needs.select.outputs.overlay_matrix }}

  repository:
    needs: [select, environment, shared, overlays]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.shared.result == 'success' &&
      contains(needs.select.outputs.shared_matrix, 'kernel') &&
      (needs.overlays.result == 'success' || needs.select.outputs.has_rootfs == 'false')
    uses: ./.github/workflows/_publish.yml
    secrets:
      SUNUEFI_REPO_GPG_KEY: ${{ secrets.SUNUEFI_REPO_GPG_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    with:
      image_id: ${{ needs.environment.outputs.image_id }}
      cache_key: ${{ needs.environment.outputs.cache_key }}
      overlay_matrix: ${{ needs.select.outputs.overlay_matrix }}
      bsp_key: ${{ needs.shared.outputs.bsp_key }}

  build:
    needs: [select, environment, shared, repository]
    if: needs.select.outputs.has_rootfs == 'true' && needs.repository.result == 'success'
    uses: ./.github/workflows/_rootfs.yml
    with:
      image_id: ${{ needs.environment.outputs.image_id }}
      cache_key: ${{ needs.environment.outputs.cache_key }}
      matrix: ${{ needs.select.outputs.rootfs_matrix }}
      shared_target: ${{ needs.select.outputs.shared_target }}
      bsp_key: ${{ needs.shared.outputs.bsp_key }}

  logs:
    needs: [select, environment, shared, repository, build, overlays]
    if: always() && needs.select.outputs.has_build == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Publish one logs.zip and remove intermediate log artifacts
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: logs
          pattern: build-logs-*
          separate-directories: true
          delete-merged: true
          retention-days: 7
          compression-level: 6
