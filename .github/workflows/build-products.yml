name: Build products

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-products.yml'
      - '.github/workflows/_*.yml'
      - '.github/actions/**'
      - 'build.sh'
      - 'Makefile'
      - 'requirements-build.txt'
      - 'containers/**'
      - 'config/**'
      - 'sources.lock.json'
      - '.gitmodules'
      - 'patches/**'
      - 'uefi/**'
      - 'vendor/piano/**'
      - 'vendor/piano-linux/**'
      - 'vendor/firmware/**'
      - 'linux/**'
      - 'tools/**'
      - '!tools/check_host.py'
      - '!tools/build/check_patch_series.py'
      - 'upstream/**'
      - 'android/**'
      - 'docs/user/install-from-artifact.md'
  workflow_dispatch:
    inputs:
      target:
        description: Product to build
        type: choice
        options: [all, uefi, linux, debian-gnome, debian-kde, debian-denial, nyarch-gnome, arch-denial, steamos]
        default: all

permissions:
  contents: read

# Keep each signed index in place until its images are assembled. Pushes can
# select different products, so do not let a new run replace a waiting one.
concurrency:
  group: build-products-${{ github.ref }}
  queue: max

jobs:
  select:
    runs-on: ubuntu-26.04
    outputs:
      has_build: ${{ steps.targets.outputs.has_build }}
      has_rootfs: ${{ steps.targets.outputs.has_rootfs }}
      rootfs_matrix: ${{ steps.targets.outputs.rootfs_matrix }}
      overlay_matrix: ${{ steps.targets.outputs.overlay_matrix }}
      shared_target: ${{ steps.targets.outputs.shared_target }}
      shared_matrix: ${{ steps.targets.outputs.shared_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Check patch series and build rules
        run: |
          ./build.sh check --pattern test_check_patch_series.py \
            --pattern test_prepare_sources.py \
            --pattern test_shared_products.py --pattern test_ci_container.py
      - id: targets
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: python3 tools/ci_build_targets.py
  environment:
    needs: select
    if: needs.select.outputs.has_build == 'true'
    runs-on: ubuntu-26.04-arm
    outputs:
      image_id: ${{ steps.image.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - name: Check systemd-boot entry updates and recovery
        run: ./build.sh check --group python-all --no-skips --pattern test_kernel_install.py
      - id: cache-key
        run: python3 tools/build/ci_container.py key --github-output "$GITHUB_OUTPUT"
      - id: cached-image
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ steps.cache-key.outputs.key }}
      - id: image
        name: Build or verify the shared builder image
        run: python3 tools/build/ci_container.py prepare --github-output "$GITHUB_OUTPUT"
      - name: Save the verified builder image once
        if: steps.cached-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/ci-builder
          key: ${{ steps.cache-key.outputs.key }}
      - name: Check signed publication and native package selection
        run: |
          docker run --rm --network none -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/workspace:ro" -w /workspace sunuefi-builder bash -euc '
              id -u sunuefi-build >/dev/null 2>&1 ||
                useradd --system --create-home sunuefi-build
              ./build.sh check --group python-all --no-skips \
                --pattern "test_repo*.py" --pattern test_kernel_package.py \
                --pattern "test_overlay*.py" --pattern test_debian_overlay_cache.py \
                --pattern test_build_nyarch_apps.py --pattern test_stage_arch_piano.py \
                --pattern test_build_libcamera_packages.py --pattern test_build_pipewire_packages.py \
                --pattern test_denial_packages.py --pattern test_denial_manifest.py
            '
      - name: Pass the verified builder image to this run
        uses: ./.github/actions/build-input
        with:
          operation: upload
          name: builder
          paths: |
            build/ci-builder/image.tar
            build/ci-builder/manifest.json

  shared:
    needs: [select, environment]
    if: needs.select.outputs.has_build == 'true'
    uses: ./.github/workflows/_shared.yml
    with:
      image_id: ${{ needs.environment.outputs.image_id }}
      shared_matrix: ${{ needs.select.outputs.shared_matrix }}
      build_denial: >-
        ${{ contains(fromJSON(needs.select.outputs.overlay_matrix).target, 'debian-denial') ||
            contains(fromJSON(needs.select.outputs.overlay_matrix).target, 'arch-denial') }}

  overlays:
    needs: [select, environment, shared]
    if: github.ref == 'refs/heads/main' && needs.select.outputs.has_rootfs == 'true'
    uses: ./.github/workflows/_overlays.yml
    with:
      image_id: ${{ needs.environment.outputs.image_id }}
      matrix: ${{ needs.select.outputs.overlay_matrix }}

  repository:
    needs: [select, environment, shared, overlays]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.shared.result == 'success' &&
      contains(needs.select.outputs.shared_matrix, 'kernel') &&
      (needs.overlays.result == 'success' || needs.select.outputs.has_rootfs == 'false')
    uses: ./.github/workflows/_publish.yml
    secrets:
      SUNUEFI_REPO_GPG_KEY: ${{ secrets.SUNUEFI_REPO_GPG_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    with:
      image_id: ${{ needs.environment.outputs.image_id }}
      overlay_matrix: ${{ needs.select.outputs.overlay_matrix }}

  build:
    needs: [select, environment, shared, repository]
    if: needs.select.outputs.has_rootfs == 'true' && needs.repository.result == 'success'
    uses: ./.github/workflows/_rootfs.yml
    with:
      image_id: ${{ needs.environment.outputs.image_id }}
      matrix: ${{ needs.select.outputs.rootfs_matrix }}
      shared_target: ${{ needs.select.outputs.shared_target }}

  logs:
    needs: [select, environment, shared, repository, build, overlays]
    if: always() && needs.select.outputs.has_build == 'true'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    outputs:
      archive_id: ${{ steps.merge.outputs.artifact-id }}
    steps:
      - id: build-logs
        name: Check which build tasks produced logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          logs=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("build-logs-")) | .id')
          if [[ -n "$logs" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - id: merge
        name: Collect this build’s logs
        if: steps.build-logs.outputs.present == 'true'
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: logs-${{ github.run_attempt }}
          pattern: build-logs-*
          separate-directories: true
          delete-merged: false
          retention-days: 7
          compression-level: 6
      - name: Remove temporary inputs from successful builds without mirrored images
        if: >-
          success() && !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled') &&
          (github.ref != 'refs/heads/main' || !contains(needs.select.outputs.shared_matrix, 'firmware'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("build-input-") or startswith("build-logs-")) | .id')
          while IFS= read -r id; do
            if [[ -n "$id" ]]; then
              [[ "$id" =~ ^[0-9]+$ ]]
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            fi
          done <<< "$ids"

  downloads:
    needs: [select, environment, shared, overlays, repository, build, logs]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.shared.result == 'success' && needs.logs.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      contains(needs.select.outputs.shared_matrix, 'firmware') &&
      (needs.select.outputs.has_rootfs == 'false' || needs.build.result == 'success')
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/_downloads.yml
    with:
      rootfs_matrix: ${{ needs.select.outputs.rootfs_matrix }}
      log_artifact_id: ${{ needs.logs.outputs.archive_id }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
